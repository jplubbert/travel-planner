services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel}
      POSTGRES_DB: ${POSTGRES_DB:-travel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Every setting app/config.py reads comes from .env (optional: without it the defaults
    # in config.py apply). `environment` wins over it, so only Docker-specific values and
    # values a caller must be able to override from the shell are listed there.
    env_file:
      - path: .env
        required: false
    environment: &backend-docker-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD:-travel}@db:5432/${POSTGRES_DB:-travel}
      PROVIDER_BASE_URL: http://provider-mock:4010/v1
      DOCUMENT_STORAGE_DIR: /data/documents
      # From the shell first, then .env: scripts/e2e.sh blanks it so no model is called.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - documents:/data/documents
    depends_on:
      db:
        condition: service_healthy
      provider-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Background job worker (bookings, ADR 0003; documents, ADR 0005). It can be scaled:
  # jobs are claimed with FOR UPDATE SKIP LOCKED and a lease.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.workers"]
    env_file:  # the same settings as the API
      - path: .env
        required: false
    environment: *backend-docker-env
    volumes:
      - documents:/data/documents  # shared with the API, which serves downloads
    depends_on:
      api:
        condition: service_healthy  # the API container runs the migrations

  # Simulated external provider (ADR 0002). The app only uses /v1; /_control is for tests and the demo.
  provider-mock:
    build: ./mock
    restart: unless-stopped
    environment:
      MOCK_TOKENS: ${PROVIDER_TOKEN:-travel-demo-token}
      MOCK_QUOTE_TTL_SECONDS: ${MOCK_QUOTE_TTL_SECONDS:-900}
      MOCK_SUPPLIER_DEADLINE_SECONDS: ${MOCK_SUPPLIER_DEADLINE_SECONDS:-2}
    ports:
      - "${MOCK_PORT:-4010}:4010"
    volumes:
      - mockdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4010/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Minimal UI (React + Vite), served by nginx, which also proxies /api to the API.
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  mockdata:
  documents:
