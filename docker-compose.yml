services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel}
      POSTGRES_DB: ${POSTGRES_DB:-travel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD:-travel}@db:5432/${POSTGRES_DB:-travel}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROVIDER_BASE_URL: http://provider-mock:4010/v1
      PROVIDER_TOKEN: ${PROVIDER_TOKEN:-travel-demo-token}
      DOCUMENT_STORAGE_DIR: /data/documents
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:-dev-only-insecure-mcp-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - documents:/data/documents
    depends_on:
      db:
        condition: service_healthy
      provider-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Worker de jobs en segundo plano (reservas, ADR 0003; documentos, ADR 0005). Se puede escalar:
  # los jobs se reclaman con FOR UPDATE SKIP LOCKED y lease.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.workers"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD:-travel}@db:5432/${POSTGRES_DB:-travel}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROVIDER_BASE_URL: http://provider-mock:4010/v1
      PROVIDER_TOKEN: ${PROVIDER_TOKEN:-travel-demo-token}
      BOOKING_UNKNOWN_GRACE_SECONDS: ${BOOKING_UNKNOWN_GRACE_SECONDS:-30}
      BOOKING_SUBMITTED_STALE_SECONDS: ${BOOKING_SUBMITTED_STALE_SECONDS:-60}
      DOCUMENT_STORAGE_DIR: /data/documents
    volumes:
      - documents:/data/documents  # shared with the API, which serves downloads
    depends_on:
      api:
        condition: service_healthy  # the API container runs the migrations

  # Proveedor externo simulado (ADR 0002). La app solo usa /v1; /_control es para tests y demo.
  provider-mock:
    build: ./mock
    restart: unless-stopped
    environment:
      MOCK_TOKENS: ${PROVIDER_TOKEN:-travel-demo-token}
      MOCK_QUOTE_TTL_SECONDS: ${MOCK_QUOTE_TTL_SECONDS:-900}
      MOCK_SUPPLIER_DEADLINE_SECONDS: ${MOCK_SUPPLIER_DEADLINE_SECONDS:-2}
    ports:
      - "${MOCK_PORT:-4010}:4010"
    volumes:
      - mockdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4010/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  mockdata:
  documents:
