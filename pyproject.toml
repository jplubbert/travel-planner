[project]
name = "travel-planner"
version = "0.1.0"
description = "Take-home: plataforma de planificación de viajes en grupo con proveedor mock y asistente MCP de solo lectura."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "mcp>=1.2",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
]

[tool.uv]
# Aplicación, no librería: no se construye como paquete instalable.
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "mock/tests"]
pythonpath = ["backend", "mock"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requiere Postgres y/o el mock en ejecución",
    "llm: requiere acceso a un modelo (coste real); excluido por defecto",
]
addopts = "-m 'not llm' --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "mock", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migraciones autogeneradas por Alembic: se revisan, no se reformatean.
"backend/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
