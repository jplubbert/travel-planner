server {
  listen 80;
  root /usr/share/nginx/html;

  # Status channel (SSE): no buffering and long reads, or events would arrive in bursts.
  location ~ ^/api/trips/[^/]+/events$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;  # the assistant can take up to ASSISTANT_TIMEOUT_SECONDS
  }

  location / {
    try_files $uri /index.html;
  }
}
